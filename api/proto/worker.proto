syntax = "proto3";

package wpcp.worker.v1;

option go_package = "github.com/nnviet06/worker-pool-control-plane/api/proto;workerpb";

// Worker is the service every worker, real or fake, exposes to the proxy.
service Worker {
  rpc Execute(ExecuteRequest) returns (ExecuteResponse);
}

message ExecuteRequest {
  string class       = 1;   // copied from X-Wpcp-Class
  int64  deadline_ms = 2;   // absolute, unix millis; final cutoff for the whole request
  bytes  payload     = 3;   // opaque to the proxy
}

message ExecuteResponse {
  int32  status     = 1;
  bytes  payload    = 2;
  map<string, int64> timings_ms = 3;   // server-side timings, read only by calibrate
}
